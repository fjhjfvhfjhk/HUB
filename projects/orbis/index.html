(function() {
  function sendError(msg, stack, lineno, colno) {
    try {
      window.parent.postMessage({
        type: "BDS_VISUALIZER_ERROR",
        message: String(msg || "Script error"),
        stack: stack ? String(stack) : null,
        lineno: lineno ?? null,
        colno: colno ?? null
      }, "*");
    } catch(e) {}
  }
  window.addEventListener("error", function(e) {
    sendError(e.message, e.error ? e.error.stack : null, e.lineno, e.colno);
  });
  window.addEventListener("unhandledrejection", function(e) {
    var reason = e.reason;
    var msg = reason ? (reason.message || String(reason)) : "Unhandled Promise Rejection";
    var stack = reason && reason.stack ? reason.stack : null;
    sendError(msg, stack);
  });

(function () {

  // Мировые размеры

  var elMap = new WeakMap();

  function radiusFor(m) { return Math.max(5, Math.pow(m, 0.24) * 1.9); }
  function pickColor() { return PALETTE[(Math.random() * PALETTE.length) | 0]; }
  function hexA(hex, a) {
    var h = hex.charAt(0) === '#' ? hex.slice(1) : hex;
    return 'rgba(' +
      parseInt(h.substring(0, 2), 16) + ',' +
      parseInt(h.substring(2, 4), 16) + ',' +
      parseInt(h.substring(4, 6), 16) + ',' + a + ')';

  function makeBody(x, y, vx, vy, m, color) {
    return { x: x, y: y, vx: vx, vy: vy, ax: 0, ay: 0, m: m, r: radiusFor(m), color: color || pickColor() };

    while (bodies.length > MAX_BODIES) bodies.splice(1, 1);

  function viewportSize() {
    var w = window.innerWidth;

  function controlsHeight() {
    var c = document.querySelector('.controls');

    if (r.height < 40 || r.height > 700) return 240;

  function fitScale() {
    var sx = W / (WORLD_HW * 2);
    var sy = PLAY_H / (WORLD_HH * 2);

    updateCameraTransform();
    updateStars();
  }

  function updateCameraTransform() {
    var tx = W / 2 - cam.x * cam.scale;
    var ty = PLAY_H / 2 - cam.y * cam.scale;
    layer.style.transform = 'translate(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px) scale(' + cam.scale.toFixed(4) + ')';
    cZ.textContent = cam.scale.toFixed(2);
  }

  function updateStars() {
    var px = -(cam.x * cam.scale * 0.18) % 400;
    var py = -(cam.y * cam.scale * 0.18) % 400;
    stars.style.backgroundPosition = px + 'px ' + py + 'px';
  }

  /* ---------- DOM sync ---------- */

  function createEl(b) {
    var el = document.createElement('div');
    el.className = 'body';
    el.style.backgroundColor = b.color;
    layer.appendChild(el);
    elMap.set(b, el);
    return el;
  }

  function applyBodyStyle(el, b) {
    var size = b.r * 2;
    var curR = parseFloat(el.dataset.r || '0');
    if (Math.abs(curR - b.r) > 0.15) {
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.dataset.r = b.r;
    }
    el.style.transform = 'translate3d(' + (b.x - b.r).toFixed(1) + 'px,' + (b.y - b.r).toFixed(1) + 'px,0)';

    // многослойное свечение
    if (b.m > 20000) {
      el.style.boxShadow =
        '0 0 ' + (b.r * 2).toFixed(1) + 'px ' + (b.r * 0.8).toFixed(1) + 'px ' + hexA(b.color, 0.85) +
        ',0 0 ' + (b.r * 6).toFixed(1) + 'px ' + (b.r * 2).toFixed(1) + 'px ' + hexA(b.color, 0.35) +
        ',0 0 ' + (b.r * 12).toFixed(1) + 'px ' + (b.r * 4).toFixed(1) + 'px ' + hexA(b.color, 0.15);
    } else if (b.m > 2000) {
      el.style.boxShadow =
        '0 0 ' + (b.r * 1.6).toFixed(1) + 'px ' + (b.r * 0.5).toFixed(1) + 'px ' + hexA(b.color, 0.7) +
        ',0 0 ' + (b.r * 4).toFixed(1) + 'px ' + (b.r * 1.5).toFixed(1) + 'px ' + hexA(b.color, 0.25);
    } else {
      el.style.boxShadow = '0 0 ' + (b.r * 1.2).toFixed(1) + 'px ' + hexA(b.color, 0.6);
    }
  }

  function syncDOM() {
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      var el = elMap.get(b) || createEl(b);
      applyBodyStyle(el, b);
    }
    for (var k = layer.children.length - 1; k >= 0; k--) {
      var el2 = layer.children[k];
      if (el2.className !== 'body') continue;
      var found = false;
      for (var j = 0; j < bodies.length; j++) {
        if (elMap.get(bodies[j]) === el2) { found = true; break; }
      }
      if (!found) layer.removeChild(el2);
    }
  }

  /* ---------- trails ---------- */

  function spawnGhost(b) {
    var size = b.r * 2.2;
    var el = document.createElement('div');
    el.className = 'ghost';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.backgroundColor = b.color;
    el.style.boxShadow = '0 0 ' + (b.r * 2).toFixed(1) + 'px ' + hexA(b.color, 0.7);
    el.style.transform = 'translate3d(' + (b.x - size / 2).toFixed(1) + 'px,' + (b.y - size / 2).toFixed(1) + 'px,0)';
    el.style.opacity = String(trailAlpha);
    layer.appendChild(el);
    ghosts.push({ el: el, born: performance.now(), life: trailLife, alpha: trailAlpha });
    if (ghosts.length > MAX_GHOSTS) {
      var g = ghosts.shift();
      if (g.el.parentNode) g.el.parentNode.removeChild(g.el);
    }
  }

  function updateGhosts(now) {
    for (var i = ghosts.length - 1; i >= 0; i--) {
      var g = ghosts[i];
      var age = now - g.born;
      if (age >= g.life) {
        if (g.el.parentNode) g.el.parentNode.removeChild(g.el);
        ghosts.splice(i, 1);
      } else {
        var t = age / g.life;
        g.el.style.opacity = (g.alpha * (1 - t) * (1 - t)).toFixed(3);
      }
    }
  }

  function clearGhosts() {
    for (var i = 0; i < ghosts.length; i++) {
      if (ghosts[i].el.parentNode) ghosts[i].el.parentNode.removeChild(ghosts[i].el);
    }
    ghosts = [];
  }

  /* ---------- physics ---------- */

  function physics(dt) {
    var n = bodies.length;
    if (n < 2) return;
    var soft = IS_TOUCH ? 60 : 40;
    var i, j, a, b, dx, dy, d2, inv;

    for (i = 0; i < n; i++) { bodies[i].ax = 0; bodies[i].ay = 0; }

    for (i = 0; i < n; i++) {
      a = bodies[i];
      for (j = i + 1; j < n; j++) {
        b = bodies[j];
        dx = b.x - a.x;
        dy = b.y - a.y;
        d2 = dx * dx + dy * dy + soft;
        inv = G / (d2 * Math.sqrt(d2));
        a.ax += inv * b.m * dx;
        a.ay += inv * b.m * dy;
        b.ax -= inv * a.m * dx;
        b.ay -= inv * a.m * dy;
      }
    }

    for (i = 0; i < n; i++) {
      b = bodies[i];
      b.vx += b.ax * dt;
      b.vy += b.ay * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
  }

  function applyBounds() {
    if (boundMode === 'open') return;
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      var r = b.r;

      if (boundMode === 'bounce') {
        if (b.x - r < -WORLD_HW) { b.x = -WORLD_HW + r; b.vx = -b.vx * 0.88; }
        if (b.x + r > WORLD_HW)  { b.x = WORLD_HW - r;  b.vx = -b.vx * 0.88; }
        if (b.y - r < -WORLD_HH) { b.y = -WORLD_HH + r; b.vy = -b.vy * 0.88; }
        if (b.y + r > WORLD_HH)  { b.y = WORLD_HH - r;  b.vy = -b.vy * 0.88; }
      } else if (boundMode === 'wrap') {
        var wx = WORLD_HW * 2, wy = WORLD_HH * 2;
        if (b.x < -WORLD_HW - r) b.x += wx;
        else if (b.x > WORLD_HW + r) b.x -= wx;
        if (b.y < -WORLD_HH - r) b.y += wy;
        else if (b.y > WORLD_HH + r) b.y -= wy;
      }
    }
  }

  function handleCollisions() {
    for (var i = 0; i < bodies.length; i++) {
      for (var j = i + 1; j < bodies.length; j++) {
        var a = bodies[i], b = bodies[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        var d2 = dx * dx + dy * dy;
        var rr = (a.r + b.r) * 0.8;

        if (d2 >= rr * rr) continue;

        var d = Math.sqrt(d2) || 0.01;

        if (collisionMode === 'merge') {
          var M = a.m + b.m;
          a.x = (a.x * a.m + b.x * b.m) / M;
          a.y = (a.y * a.m + b.y * b.m) / M;
          a.vx = (a.vx * a.m + b.vx * b.m) / M;
          a.vy = (a.vy * a.m + b.vy * b.m) / M;
          a.m = M;
          a.r = radiusFor(M);
          bodies.splice(j, 1);
          j--;
        } else {
          // упругий отскок
          var nx = dx / d, ny = dy / d;
          var dvx = b.vx - a.vx, dvy = b.vy - a.vy;
          var dvn = dvx * nx + dvy * ny;
          // расталкивание, если сближаются
          if (dvn < 0) {
            var e = 0.9;
            var invM1 = 1 / a.m, invM2 = 1 / b.m;
            var jImp = -(1 + e) * dvn / (invM1 + invM2);
            a.vx -= jImp * nx * invM1;
            a.vy -= jImp * ny * invM1;
            b.vx += jImp * nx * invM2;
            b.vy += jImp * ny * invM2;
          }
          // разводим по позициям
          var overlap = rr - d;
          var totalInv = 1 / a.m + 1 / b.m;
          a.x -= nx * overlap * (1 / a.m) / totalInv;
          a.y -= ny * overlap * (1 / a.m) / totalInv;
          b.x += nx * overlap * (1 / b.m) / totalInv;
          b.y += ny * overlap * (1 / b.m) / totalInv;
        }
      }
    }
  }

  /* ---------- prediction ---------- */

  function predictPath(startX, startY, startVx, startVy, mass) {
    var probe = { x: startX, y: startY, vx: startVx, vy: startVy };
    var dt = 0.08;
    var steps = PREDICT_STEPS;
    var soft = 60;
    var n = bodies.length;
    var path = new Array(steps);

    for (var s = 0; s < steps; s++) {
      var ax = 0, ay = 0;
      for (var i = 0; i < n; i++) {
        var b = bodies[i];
        var dx = b.x - probe.x, dy = b.y - probe.y;
        var d2 = dx * dx + dy * dy + soft;
        var inv = G * b.m / (d2 * Math.sqrt(d2));
        ax += inv * dx;
        ay += inv * dy;
      }
      probe.vx += ax * dt;
      probe.vy += ay * dt;
      probe.x += probe.vx * dt;
      probe.y += probe.vy * dt;
      path[s] = probe.x.toFixed(1) + ',' + probe.y.toFixed(1);
    }
    return path;
  }

  function worldToScreen(wx, wy) {
    return {
      x: (wx - cam.x) * cam.scale + W / 2,
      y: (wy - cam.y) * cam.scale + PLAY_H / 2
    };
  }
  function screenToWorld(sx, sy) {
    return {
      x: (sx - W / 2) / cam.scale + cam.x,
      y: (sy - PLAY_H / 2) / cam.scale + cam.y
    };
  }

  /* ---------- aim overlay ---------- */

  var drag = { active: false, id: null, x0: 0, y0: 0, x1: 0, y1: 0 };

  function showAim() {
    var x0 = drag.x0, y0 = drag.y0, x1 = drag.x1, y1 = drag.y1;
    var len = Math.hypot(x1 - x0, y1 - y0);

    overlay.style.display = 'block';
    aimOrigin.setAttribute('cx', x0);
    aimOrigin.setAttribute('cy', y0);
    aimOrigin.setAttribute('r', Math.max(6, radiusFor(spawnMass) * cam.scale + 2));

    if (len >= 6) {
      aimLine.setAttribute('x1', x0);
      aimLine.setAttribute('y1', y0);
      aimLine.setAttribute('x2', x1);
      aimLine.setAttribute('y2', y1);
      aimLine.style.display = 'block';

      // prediction
      var now = performance.now();
      if (now - lastPredictAt > PREDICT_THROTTLE) {
        lastPredictAt = now;
        var wStart = screenToWorld(x0, y0);
        var vx = (x1 - x0) * 0.085;
        var vy = (y1 - y0) * 0.085;
        var vmax = 45;
        var vlen = Math.hypot(vx, vy);
        if (vlen > vmax) { vx = vx / vlen * vmax; vy = vy / vlen * vmax; }
        var worldPath = predictPath(wStart.x, wStart.y, vx, vy, spawnMass);
        // transform to screen
        var screenPts = [];
        for (var i = 0; i < worldPath.length; i++) {
          var parts = worldPath[i].split(',');
          var sp = worldToScreen(parseFloat(parts[0]), parseFloat(parts[1]));
          screenPts.push(sp.x.toFixed(1) + ',' + sp.y.toFixed(1));
        }
        predict.setAttribute('points', screenPts.join(' '));
        predict.style.display = 'block';
      }
    } else {
      aimLine.style.display = 'none';
      predict.style.display = 'none';
    }
  }

  function hideAim() {
    overlay.style.display = 'none';
    predict.style.display = 'none';
    aimLine.style.display = 'none';
  }

  /* ---------- presets ---------- */

  function presetSolar() {
    bodies = []; clearDOM(); clearGhosts();
    bodies.push(makeBody(0, 0, 0, 0, 60000, STAR_COLOR));
    var N = IS_TOUCH ? 7 : 9;
    for (var i = 0; i < N; i++) {
      var ang = (i / N) * Math.PI * 2 + Math.random() * 0.35;
      var dist = 90 + i * 42 + Math.random() * 16;
      var m = 20 + Math.random() * 160;
      var v = Math.sqrt(G * 60000 / dist) * (0.96 + Math.random() * 0.08);
      bodies.push(makeBody(
        Math.cos(ang) * dist, Math.sin(ang) * dist,
        -Math.sin(ang) * v, Math.cos(ang) * v, m
      ));
    }
  }

  function presetBinary() {
    bodies = []; clearDOM(); clearGhosts();
    var m = 30000, r = 110;
    var v = Math.sqrt(G * m / (4 * r));
    bodies.push(makeBody(-r, 0, 0, v, m, '#fbbf24'));
    bodies.push(makeBody(r, 0, 0, -v, m, '#f59e0b'));
    var N = IS_TOUCH ? 6 : 8;
    for (var i = 0; i < N; i++) {
      var ang = Math.random() * Math.PI * 2;
      var dist = 220 + Math.random() * 130;
      var pm = 20 + Math.random() * 120;
      var pv = Math.sqrt(G * 2 * m / dist);
      bodies.push(makeBody(
        Math.cos(ang) * dist, Math.sin(ang) * dist,
        -Math.sin(ang) * pv, Math.cos(ang) * pv, pm
      ));
    }
  }

  function presetCloud() {
    bodies = []; clearDOM(); clearGhosts();
    var N = IS_TOUCH ? 22 : 30;
    for (var i = 0; i < N; i++) {
      var ang = Math.random() * Math.PI * 2;
      var dist = Math.sqrt(Math.random()) * 300;
      var m = 200 + Math.random() * 2600;
      var v = Math.sqrt(G * 18000 / (dist + 70)) * (0.55 + Math.random() * 0.45);
      bodies.push(makeBody(
        Math.cos(ang) * dist, Math.sin(ang) * dist,
        -Math.sin(ang) * v, Math.cos(ang) * v, m
      ));
    }
  }

  function presetFigure8() {
    // Классическое решение задачи трёх тел (Chenciner-Montgomery)
    // Оригинал: G=1, m=1, p=±0.97, v~0.47, период 6.32
    // Масштабируем: k=300, m=100000, v-множитель = sqrt(100000/300) ≈ 18.26
    bodies = []; clearDOM(); clearGhosts();
    var M = 100000;
    var k = 300;
    var vm = 18.26;
    bodies.push(makeBody( k * 0.97000436, -k * 0.24308753,  vm * 0.466203685, vm * 0.43236573, M, '#60a5fa'));
    bodies.push(makeBody(-k * 0.97000436,  k * 0.24308753,  vm * 0.466203685, vm * 0.43236573, M, '#f472b6'));
    bodies.push(makeBody(0, 0, vm * -0.93240737, vm * -0.86473146, M, '#4ade80'));
  }

  function clearDOM() {
    while (layer.firstChild) layer.removeChild(layer.firstChild);
    layer.appendChild(worldRect);
    elMap = new WeakMap();
  }

  function applyPreset(name) {
    if (name === 'solar') presetSolar();
    else if (name === 'binary') presetBinary();
    else if (name === 'cloud') presetCloud();
    else if (name === 'figure8') presetFigure8();
    else { bodies = []; clearDOM(); clearGhosts(); }
    acc = 0;
    syncDOM();
  }

  /* ---------- main loop ---------- */

  var starsDirty = false;
  var lastCam = { x: 0, y: 0, scale: 1 };

  function loop(now) {
    var dtReal = Math.min(50, now - last);
    last = now;

    if (!paused) {
      acc += dtReal * TIME_PER_MS * speedMul;
      var guard = 0;
      while (acc >= FIXED && guard < MAX_SUBSTEPS) {
        physics(FIXED);
        applyBounds();
        handleCollisions();
        acc -= FIXED;
        guard++;
      }
      if (guard >= MAX_SUBSTEPS) acc = 0;
      capBodies();
      syncDOM();

      if (trailLevel > 0 && now - lastGhost > trailInterval) {
        lastGhost = now;
        for (var i = 0; i < bodies.length; i++) {
          var b = bodies[i];
          var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
          if (sp > 0.6) spawnGhost(b);
        }
      }
    }

    updateGhosts(now);

    // Обновляем transform камеры, если она изменилась
    if (cam.x !== lastCam.x || cam.y !== lastCam.y || cam.scale !== lastCam.scale) {
      lastCam.x = cam.x; lastCam.y = cam.y; lastCam.scale = cam.scale;
      updateCameraTransform();
      updateStars();
    }

    // обновляем позиции SVG-прицела при активном драге
    if (drag.active) {
      // (обновление в showAim вызывается из pointermove; здесь — только при затишье)
    }

    if ((frameCounter++ % 10) === 0) {
      cCount.textContent = String(bodies.length);
      cG.textContent = G.toFixed(2);
    }

    requestAnimationFrame(loop);
  }

  /* ---------- input ---------- */

  var pointers = {};   // id -> {x, y}
  var pointerCount = 0;
  var gesture = { active: false, ids: [], startDist: 0, startScale: 1, startMidX: 0, startMidY: 0, startCamX: 0, startCamY: 0 };

  function getPoint(e) {
    return { x: e.clientX, y: e.clientY };
  }

  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    hintEl.style.opacity = '0';
    setTimeout(function () { hintEl.style.display = 'none'; }, 500);
  }

  function startDrag(p) {
    drag.active = true;
    drag.x0 = p.x; drag.y0 = p.y;
    drag.x1 = p.x; drag.y1 = p.y;
    showAim();
  }
  function moveDrag(p) {
    if (!drag.active) return;
    drag.x1 = p.x; drag.y1 = p.y;
    showAim();
  }
  function cancelDrag() {
    drag.active = false;
    hideAim();
  }
  function endDrag() {
    if (!drag.active) return;
    drag.active = false;
    hideAim();
    hideHint();

    var dx = drag.x1 - drag.x0;
    var dy = drag.y1 - drag.y0;
    var len = Math.hypot(dx, dy);

    var w0 = screenToWorld(drag.x0, drag.y0);

    if (len >= 6) {
      var vx = dx * 0.085;
      var vy = dy * 0.085;
      var vmax = 45;
      var vlen = Math.hypot(vx, vy);
      if (vlen > vmax) { vx = vx / vlen * vmax; vy = vy / vlen * vmax; }
      bodies.push(makeBody(w0.x, w0.y, vx, vy, spawnMass));
    } else {
      bodies.push(makeBody(w0.x, w0.y, 0, 0, spawnMass));
    }
    capBodies();
    syncDOM();
  }

  function startGesture() {
    var ids = Object.keys(pointers);
    if (ids.length !== 2) return;
    var p1 = pointers[ids[0]], p2 = pointers[ids[1]];
    gesture.active = true;
    gesture.ids = ids;
    gesture.startDist = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
    gesture.startScale = cam.scale;
    gesture.startMidX = (p1.x + p2.x) / 2;
    gesture.startMidY = (p1.y + p2.y) / 2;
    gesture.startCamX = cam.x;
    gesture.startCamY = cam.y;
  }

  function updateGesture() {
    if (!gesture.active) return;
    var ids = gesture.ids;
    var p1 = pointers[ids[0]], p2 = pointers[ids[1]];
    if (!p1 || !p2) return;

    var dist = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
    var midX = (p1.x + p2.x) / 2;
    var midY = (p1.y + p2.y) / 2;

    var newScale = gesture.startScale * (dist / gesture.startDist);
    if (newScale < MIN_SCALE) newScale = MIN_SCALE;
    if (newScale > MAX_SCALE) newScale = MAX_SCALE;

    // world point под начальным mid
    var wStartX = (gesture.startMidX - W / 2) / gesture.startScale + gesture.startCamX;
    var wStartY = (gesture.startMidY - PLAY_H / 2) / gesture.startScale + gesture.startCamY;

    // чтобы эта же точка оказалась под текущим mid
    cam.scale = newScale;
    cam.x = wStartX - (midX - W / 2) / newScale;
    cam.y = wStartY - (midY - PLAY_H / 2) / newScale;
  }

  function endGestureIfNeeded() {
    if (gesture.active && Object.keys(pointers).length < 2) {
      gesture.active = false;
      gesture.ids = [];
    }
  }

  function handlePointerDown(e) {
    pointers[e.pointerId] = getPoint(e);
    pointerCount = Object.keys(pointers).length;

    if (pointerCount === 1) {
      startDrag(pointers[e.pointerId]);
    } else if (pointerCount === 2) {
      cancelDrag();
      startGesture();
    }

    try { field.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }

  function handlePointerMove(e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = getPoint(e);

    if (gesture.active) {
      updateGesture();
    } else if (drag.active) {
      moveDrag(pointers[e.pointerId]);
    }
    e.preventDefault();
  }

  function handlePointerUp(e) {
    var wasDragging = drag.active && pointerCount === 1;
    delete pointers[e.pointerId];
    pointerCount = Object.keys(pointers).length;

    if (wasDragging) endDrag();
    endGestureIfNeeded();

    try { field.releasePointerCapture(e.pointerId); } catch (err) {}
  }

  if ('onpointerdown' in window) {
    field.addEventListener('pointerdown', handlePointerDown, { passive: false });
    field.addEventListener('pointermove', handlePointerMove, { passive: false });
    field.addEventListener('pointerup', handlePointerUp);
    field.addEventListener('pointercancel', function (e) {
      delete pointers[e.pointerId];
      pointerCount = Object.keys(pointers).length;
      cancelDrag();
      endGestureIfNeeded();
    });
  } else {
    // fallback touch events
    field.addEventListener('touchstart', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        pointers[t.identifier] = { x: t.clientX, y: t.clientY };
      }
      pointerCount = Object.keys(pointers).length;
      if (pointerCount === 1) {
        var p = pointers[Object.keys(pointers)[0]];
        startDrag(p);
      } else if (pointerCount === 2) {
        cancelDrag();
        startGesture();
      }
      e.preventDefault();
    }, { passive: false });

    field.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (pointers[t.identifier]) pointers[t.identifier] = { x: t.clientX, y: t.clientY };
      }
      if (gesture.active) updateGesture();
      else if (drag.active) moveDrag(pointers[Object.keys(pointers)[0]]);
      e.preventDefault();
    }, { passive: false });

    field.addEventListener('touchend', function (e) {
      var wasDragging = drag.active && pointerCount === 1;
      for (var i = 0; i < e.changedTouches.length; i++) {
        delete pointers[e.changedTouches[i].identifier];
      }
      pointerCount = Object.keys(pointers).length;
      if (wasDragging) endDrag();
      endGestureIfNeeded();
    });
    field.addEventListener('touchcancel', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) delete pointers[e.changedTouches[i].identifier];
      pointerCount = Object.keys(pointers).length;
      cancelDrag(); endGestureIfNeeded();
    });

    // mouse fallback
    field.addEventListener('mousedown', function (e) { startDrag({ x: e.clientX, y: e.clientY }); });
    window.addEventListener('mousemove', function (e) { if (drag.active) moveDrag({ x: e.clientX, y: e.clientY }); });
    window.addEventListener('mouseup', function () { if (drag.active) endDrag(); });
  }

  field.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // wheel zoom (desktop)
  field.addEventListener('wheel', function (e) {
    e.preventDefault();
    var factor = Math.exp(-e.deltaY * 0.0015);
    var oldScale = cam.scale;
    var newScale = oldScale * factor;
    if (newScale < MIN_SCALE) newScale = MIN_SCALE;
    if (newScale > MAX_SCALE) newScale = MAX_SCALE;

    var w = screenToWorld(e.clientX, e.clientY);
    cam.scale = newScale;
    cam.x = w.x - (e.clientX - W / 2) / newScale;
    cam.y = w.y - (e.clientY - PLAY_H / 2) / newScale;
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      togglePause();
    }
  });

  /* ---------- controls ---------- */

  var pauseBtn = document.getElementById('pause');
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : '⏸';
    pauseBtn.classList.toggle('active', paused);
  }
  pauseBtn.addEventListener('click', togglePause);

  document.getElementById('clear').addEventListener('click', function () {
    bodies = []; clearDOM(); clearGhosts();
  });

  document.getElementById('presets').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    Array.prototype.forEach.call(this.children, function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    applyPreset(btn.dataset.p);
  });

  document.getElementById('masses').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    Array.prototype.forEach.call(this.children, function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    spawnMass = parseFloat(btn.dataset.m);
  });

  document.getElementById('bounds').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    Array.prototype.forEach.call(this.children, function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    boundMode = btn.dataset.b;
    worldRect.style.display = (boundMode === 'open') ? 'none' : 'block';
  });

  document.getElementById('collide').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    Array.prototype.forEach.call(this.children, function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    collisionMode = btn.dataset.c;
  });

  var gSlider = document.getElementById('g');
  var gv = document.getElementById('gv');
  gSlider.addEventListener('input', function () {
    G = parseFloat(this.value);
    gv.textContent = G.toFixed(2);
    cG.textContent = G.toFixed(2);
  });

  var tSlider = document.getElementById('trail');
  var tv = document.getElementById('tv');
  function applyTrail(v) {
    trailLevel = v;
    if (v === 0) { trailInterval = 99999; trailLife = 0; trailAlpha = 0; tv.textContent = 'выкл'; clearGhosts(); }
    else if (v === 1) { trailInterval = 90; trailLife = 450; trailAlpha = 0.4; tv.textContent = 'коротк.'; }
    else if (v === 2) { trailInterval = 55; trailLife = 750; trailAlpha = 0.55; tv.textContent = 'средн.'; }
    else { trailInterval = 30; trailLife = 1200; trailAlpha = 0.62; tv.textContent = 'длин.'; }
  }
  tSlider.addEventListener('input', function () { applyTrail(parseInt(this.value, 10)); });

  var sSlider = document.getElementById('speed');
  var sv = document.getElementById('sv');
  sSlider.addEventListener('input', function () {
    speedMul = parseFloat(this.value);
    sv.textContent = speedMul.toFixed(1);
  });

  // Zoom buttons
  function zoomBy(factor, centerX, centerY) {
    if (centerX === undefined) centerX = W / 2;
    if (centerY === undefined) centerY = PLAY_H / 2;
    var oldScale = cam.scale;
    var newScale = oldScale * factor;
    if (newScale < MIN_SCALE) newScale = MIN_SCALE;
    if (newScale > MAX_SCALE) newScale = MAX_SCALE;
    var w = screenToWorld(centerX, centerY);
    cam.scale = newScale;
    cam.x = w.x - (centerX - W / 2) / newScale;
    cam.y = w.y - (centerY - PLAY_H / 2) / newScale;
  }
  document.getElementById('zIn').addEventListener('click', function () { zoomBy(1.3); });
  document.getElementById('zOut').addEventListener('click', function () { zoomBy(1 / 1.3); });
  document.getElementById('zReset').addEventListener('click', function () { resetCamera(); });

  /* ---------- init ---------- */

  applyTrail(parseInt(tSlider.value, 10));

  function boot() {
    resize();
    if (bodies.length === 0) presetSolar();
    updateCameraTransform();
    updateStars();
    syncDOM();
  }

  boot();
  requestAnimationFrame(boot);
  setTimeout(boot, 100);
  setTimeout(boot, 400);

  window.addEventListener('resize', function () { resize(); syncDOM(); });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { resize(); syncDOM(); }, 250);
  });

  requestAnimationFrame(loop);
})();
</script></body>
</html>
